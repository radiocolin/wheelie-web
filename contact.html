<html lang="en">
<head>

    <link rel="icon" type="image/png" href="assets/icon-64.png">
    <link rel="apple-touch-icon" href="assets/icon-180.png">

    <meta property="og:title" content="Contact - Wheelie">

    <meta property="og:image" content="https://wheelieapp.com/assets/og-image.png">

<body class="page">
    <!-- Navigation and footer: components.js -->

    <main>
        <div class="legal glass">
            <h1>Contact us</h1>
            <p>We’d love to hear from you.</p>
            <div class="contact-grid">
                <div class="card">
                    <h3>Comments and support</h3>
                    <p>For comments, suggestions, or help with the app, email us.</p>
                    <a href="mailto:feedback@wheelieapp.com">feedback@wheelieapp.com</a>
                </div>
                <div class="card">
                    <h3>Your subscription</h3>
                    <p>Subscriptions are managed by Apple.</p>
                    <a href="https://apps.apple.com/account/subscriptions" target="_blank" rel="noopener noreferrer">Manage your subscription</a>
                    <a href="https://support.apple.com/billing" target="_blank" rel="noopener noreferrer">Apple billing support</a>
                </div>
            </div>
        </div>
    </main>

    <script src="components.js"></script>
